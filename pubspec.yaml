name: messenger_app
description: "A Full-Stack Real-time Messenger App with WebRTC Video/Voice calls, Firebase Auth, Firestore & Cloud Storage."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Firebase Suite
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1

  # WebRTC / Calling
  flutter_webrtc: ^0.12.5

  # Utilities & Helpers
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
